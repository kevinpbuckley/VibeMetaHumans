[FilterPlugin]
; VibeMetaHumans — FilterPlugin.ini
; Lists every file/folder OUTSIDE the standard plugin structure that must ship in a packaged build
; of the plugin (UAT BuildPlugin auto-includes the .uplugin, Source/, Content/ and Resources/).

; Top-level readme (user-facing)
/README.md

; Agent-facing docs
/docs/...

; Markdown agent skills - UE 5.9 discovers <Plugin>/Skills/**/SKILL.md natively
; (ToolsetRegistry MarkdownAgentSkills), keyed /Skills/VibeMetaHumans/<pack>. Outside Content/,
; so it must be listed here to ship in a packaged build.
/Skills/...
